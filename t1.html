<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T1 - Formulário em HTML</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>T1 - Formulário em HTML</h1>

  <section id="t1">
    <form id="formularioContato">
      <div>
        <label for="nome">Nome</label><br />
        <input id="nome" name="nome" type="text" required />
      </div>
      <div>
        <label for="email">Email</label><br />
        <input id="email" name="email" type="email" required />
      </div>
      <div>
        <label for="bi">BI</label><br />
        <input id="bi" name="bi" type="text" required />
      </div>
      <div>
        <label for="numeroEstudante">Número de Estudante</label><br />
        <input id="numeroEstudante" name="numeroEstudante" type="text" required />
      </div>
      <div>
        <label for="mensagem">Mensagem</label><br />
        <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
      </div>
      <button type="submit">Enviar</button>
    </form>

    <p class="small">Último envio:</p>
    <div id="resultadoFormulario" class="resultado">Nenhum envio ainda.</div>
  </section>

  <a class="voltar-home" href="index.html">← Voltar para Home</a>
  <script src="script.js"></script>
</body>
</html>
