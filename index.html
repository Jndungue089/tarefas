<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarefas T1, T2 e T3</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.4; }
    section { margin-bottom: 28px; }
    h1, h2 { margin-bottom: 8px; }
    form, .bloco { max-width: 700px; }
    input, button, textarea, select { margin: 4px 0; padding: 6px; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #aaa; padding: 8px; text-align: left; }
    .linha { display: flex; gap: 8px; flex-wrap: wrap; }
    .resultado { background: #f5f5f5; padding: 10px; border: 1px solid #ddd; }
    .small { color: #666; font-size: 0.92rem; }
  </style>
</head>
<body>
  <h1>Tarefas (T1, T2 e T3)</h1>

  <section id="t1">
    <h2>T1 - Formulário em HTML</h2>
    <form id="formularioContato">
      <div>
        <label for="nome">Nome</label><br />
        <input id="nome" name="nome" type="text" required />
      </div>
      <div>
        <label for="email">Email</label><br />
        <input id="email" name="email" type="email" required />
      </div>
      <div>
        <label for="mensagem">Mensagem</label><br />
        <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
      </div>
      <button type="submit">Enviar</button>
    </form>

    <p class="small">Último envio:</p>
    <div id="resultadoFormulario" class="resultado">Nenhum envio ainda.</div>
  </section>

  <section id="t2">
    <h2>T2 - Tabela de mini pauta</h2>

    <div class="bloco">
      <div class="linha">
        <input id="tema" type="text" placeholder="Tema" />
        <input id="responsavel" type="text" placeholder="Responsável" />
        <select id="status">
          <option value="Pendente">Pendente</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Concluído">Concluído</option>
        </select>
        <button id="adicionarPauta" type="button">Adicionar item</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tema</th>
            <th>Responsável</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="corpoTabelaPauta"></tbody>
      </table>
    </div>
  </section>

  <section id="t3">
    <h2>T3 - Manipulação com JavaScript</h2>
    <div class="bloco">
      <input id="textoOriginal" type="text" placeholder="Digite um texto" />
      <div class="linha">
        <button type="button" id="btnMaiusculas">Maiúsculas</button>
        <button type="button" id="btnMinusculas">Minúsculas</button>
        <button type="button" id="btnInverter">Inverter</button>
        <button type="button" id="btnLimpar">Limpar</button>
      </div>
      <p class="small">Resultado:</p>
      <div id="resultadoTexto" class="resultado">---</div>
    </div>
  </section>

  <section>
    <h2>Outras tarefas</h2>
    <p class="small">As outras tarefas foram deixadas sem preenchimento, conforme solicitado.</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
